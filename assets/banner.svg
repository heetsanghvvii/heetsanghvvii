<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="0.65" stop-color="#1e3a8a"/><stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <pattern id="d" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#fff" fill-opacity="0.10"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a5b4fc"/></marker>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#g)"/>
  <rect width="1200" height="300" rx="18" fill="url(#d)"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="64" y="70" font-size="17" letter-spacing="4" fill="#a5b4fc" font-weight="700">PRODUCT MANAGER</text>
    <text x="64" y="128" font-size="54" font-weight="700" fill="#fff">Heet Sanghvi</text>
    <text x="64" y="170" font-size="22" fill="#e0e7ff">I find the problem worth solving, decide what not to build,</text>
    <text x="64" y="200" font-size="22" fill="#e0e7ff">and ship the smallest thing that moves the metric.</text>
    <g font-size="15" font-weight="700" fill="#fff">
      <rect x="64" y="232" width="118" height="36" rx="18" fill="#fff" fill-opacity="0.14"/><text x="88" y="255">Discover</text>
      <line x1="186" y1="250" x2="214" y2="250" stroke="#a5b4fc" stroke-width="2" marker-end="url(#a)"/>
      <rect x="218" y="232" width="118" height="36" rx="18" fill="#fff" fill-opacity="0.14"/><text x="244" y="255">Prioritise</text>
      <line x1="340" y1="250" x2="368" y2="250" stroke="#a5b4fc" stroke-width="2" marker-end="url(#a)"/>
      <rect x="372" y="232" width="118" height="36" rx="18" fill="#fff" fill-opacity="0.14"/><text x="396" y="255">Spec (PRD)</text>
      <line x1="494" y1="250" x2="522" y2="250" stroke="#a5b4fc" stroke-width="2" marker-end="url(#a)"/>
      <rect x="526" y="232" width="118" height="36" rx="18" fill="#fff" fill-opacity="0.14"/><text x="566" y="255">Ship</text>
      <line x1="648" y1="250" x2="676" y2="250" stroke="#a5b4fc" stroke-width="2" marker-end="url(#a)"/>
      <rect x="680" y="232" width="118" height="36" rx="18" fill="#fff" fill-opacity="0.14"/><text x="709" y="255">Measure</text>
    </g>
    <text x="1136" y="70" text-anchor="end" font-size="16" fill="#c7d2fe">Digital Product Manager</text>
    <text x="1136" y="96" text-anchor="end" font-size="16" fill="#c7d2fe">Birla Opus · Aditya Birla Group</text>
